<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Media Vault</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border: none;
      border-radius: 12px;
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      font-size: 17px;
    }
  </style>
</head>

<body>

  <h1>📦 My Media Vault</h1>

  <button class="button">🎥 Videos</button>
  <button class="button">🖼️ Images</button>
  <button class="button">🔗 Instagram Links</button>
  <button class="button">⭐ Favorites</button>
  <button class="button">🔍 Search</button>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();
  </script>

</body>
</html>
